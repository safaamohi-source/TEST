<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&family=Outfit:wght@700&family=Plus+Jakarta+Sans:wght@800&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; background: transparent; }
  .card { width: 512px; height: 792px; position: relative; }
  .group { position: absolute; left: 0; width: 470px; top: 372px; transform: translateY(-50%);
           display: flex; flex-direction: column; align-items: center; }
  .logo { display: flex; align-items: center; gap: 14px; direction: ltr; }
  .logo img { width: 92px; height: 92px; border-radius: 20px; }
  .word { display: flex; flex-direction: column; line-height: 1; }
  .mega { font: 800 50px "Plus Jakarta Sans", sans-serif; letter-spacing: 6px; color: #1a1612; }
  .furn { font: 700 21px Outfit, sans-serif; letter-spacing: 9.4px; color: #e8961e; margin-top: 6px; text-transform: uppercase; }
  .rule { width: 120px; height: 5px; border-radius: 3px; background: #e8961e; margin: 40px 0 30px; }
  .msg { font: 900 54px/1.35 Cairo, sans-serif; color: #1a1612; text-align: center; }
  .msg span { color: #e8711e; }
</style></head>
<body><div class="card"><div class="group">
  <div class="logo"><img src="mega-logo.jpg" alt=""><div class="word"><div class="mega">MEGA</div><div class="furn">Furniture</div></div></div>
  <div class="rule"></div>
  <div class="msg">مبروك<br><span>فرشت شقتك</span></div>
</div></div></body></html>
